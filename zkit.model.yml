groundTruth:
  - id: gt/comptime-anytype-anida
    fact: >-
      La config anidada por dominios SÍ se puede recorrer en 0.17-dev.1884. El
      requisito es `comptime c: anytype`: con el config como parámetro runtime,
      `@field(c, fname)` es runtime y `dom.entries[i]` falla con "tuple field
      index must be comptime-known". Con el parámetro marcado `comptime`
      resuelve. No hace falta `inline for` — dentro de `comptime {}` un `for`
      normal ya es comptime. No hace falta `std.meta.FieldEnum` ni
      `@enumFromInt`.
      Verificado por axon1 compilando y ejecutando contra 1884
      (io.NotFound=1000, io.Denied=1001, net.Timeout=2000).
      Corolario: un `@compileError` sobre rangos solapados convierte la
      unicidad de códigos en garantía POR CONSTRUCCIÓN, demostrada — con bases
      solapadas el programa no compila.
    contradice: >-
      El report r2 de zkit-errors, que declaró "domain nesting is not
      achievable in 0.17-dev.1884". Diagnóstico falso, no re-aceptar.
  - id: gt/napi-teardown-reentry
    fact: >-
      Destruir una sesión desde el hilo de JS mientras un callback nativo está
      en vuelo hacia JS es un DEADLOCK, no una lentitud. Medido en hyperdiff:
      main en `WatcherState.stop` (watcher.zig:714) esperando el join; hilo del
      pipeline dentro de `baseline_trampoline_0` esperando el main thread para
      entrar en JS. 51 min vivo con 1.2 s de CPU.
      Fix que funciona (verificado e2e por axon1, RUNNER_EXIT=0 + JSON en
      disco): `stop()` anula los punteros a callback con `@atomicStore(.release)`
      ANTES del join, así el hilo que aún no ha leído observa null y no reentra;
      los que ya están dentro los corta un flag `closing` mutex-guarded en el
      lado del host. Sin sleeps, sin timeouts, sin force-exit.
      Segundo hallazgo del mismo diff: seis lecturas de esos punteros eran
      `load` planos desde hilos watcher/platform — data race PRE-EXISTENTE,
      ahora `@atomicLoad(.acquire)`.
    aplicabilidad: >-
      La forma es genérica (teardown que joinea un hilo que puede reentrar en
      el runtime host), no específica de NAPI. Revisar el mismo patrón en el
      byte-runtime de styx antes de dar por bueno cualquier path de cierre.
    notTested: 'si el mismo patrón se repite en otros trampolines de addon.c (~1900 líneas)'
  - id: gt/sigtrap-tapaba-el-deadlock
    fact: >-
      Un crash puede ENMASCARAR un cuelgue. `addon.c` no abría ni un
      `handle_scope` en ~1900 líneas: un drain largo acumulaba handles hasta
      superar el límite de JSC → SIGTRAP (exit 133 = 128+5). Ese crash mataba
      el proceso ANTES del teardown, así que ninguna run llegó nunca a un
      cierre limpio y el deadlock de gt/napi-teardown-reentry era invisible.
      Corolario operativo: arreglar un crash y ver aparecer un cuelgue nuevo NO
      es una regresión del fix — es lo siguiente que había debajo.
  - id: gt/min-version-not-enforced
    fact: >-
      `minimum_zig_version` NO se enforcea. Probado con el compiler 1884 contra
      0.99.0, 0.17.0, 0.17.0-dev.9999 y 0.18.0-dev.1, como paquete raíz y como
      dependencia por path: acepta las cuatro. Leer un `.zon` NO dice con qué
      compiler algo compila.
    notTested: 'dependencia fetched por URL+hash'
  - id: gt/017-not-a-release
    fact: >-
      `0.17.0` no existe como release. ziglang.org publica 0.16.0, 0.15.2,
      0.15.1, 0.14.1, 0.14.0, 0.13.0 y master. Los proyectos que declaran
      "0.17.0" nombran una versión inexistente.
  - id: gt/optimize-renamed
    fact: >-
      El enum Optimize se RENOMBRÓ, no se minusculizó. Tags reales
      {debug,safe,fast,small} (std/lang.zig:118-124); las mayúsculas
      sobreviven como decls DEPRECADAS (:127-133, "removed after 0.18.0").
      Por eso `builtin.mode == .Debug` falla (== exige campo) y
      `module.optimize = .ReleaseSafe` compila (asignación resuelve decl).
      Fix correcto = `.debug/.safe/.fast/.small`, NUNCA `release_*`.
      Un sed a ciegas rompe más de lo que arregla.
  - id: gt/pss-verify-broken
    fact: >-
      `std.crypto.Certificate.rsa.PSSSignature.verify` es INCALLABLE en 1884:
      declara `sig: [modulus_len]u8` por valor (:1030) y se lo pasa a
      `concatVerify`, que exige `*const [modulus_len]u8` (:1040). El bug vive
      DENTRO de std. Fix = llamar a concatVerify directamente. Ojo: hay un
      segundo bloque verify/concatVerify en :1193 (PKCS1-v1.5) con firma de
      puntero — confundirlos es el error que axon1 cometió en 1f11d13.
  - id: gt/drift-inside-017
    fact: >-
      El drift NO fue 0.16→0.17: fue DENTRO del canal 0.17-dev, entre e1a034e
      (5-jul, donde migró quic-zig) y el pin 1884 (25-ago). 7 semanas = 2
      breaking changes de std. "Alineado a la última" es impuesto recurrente,
      no coste único.
  - id: gt/diffbatch-exists
    fact: >-
      `hyperdiff/core/zig/src/parallel.zig:41` YA implementa `diffBatch()` con
      std.Thread.Pool, arena por fichero, sin estado compartido. Lo único que
      falta es la superficie C-ABI. "diffBatch: available, not wired" del doc
      compartido significa disponible en Zig, no en FFI.
    caveat: 'PERO batchea la función equivocada para el consumidor real — ver gt/batch-wrong-target.'

  - id: gt/batch-wrong-target
    date: '2026-08-27'
    origin: 'agente batch-export (read-only), verificado leyendo el call-site real'
    fact: >-
      `parallel.diffBatch` batchea COMPUTE CRUDO (Edit[]), pero el hot path de
      mission-control NUNCA llama a `hyperdiff_compute`: `ffiDiff`/`ffiDiffRefs`
      (diff.ts:92-107,219-239) llaman a `diffToMetadata()` → `hyperdiff_metadata_packed`
      y `diffPatch()` → `hyperdiff_patch`. Además `prefetchDiffs`
      (git.handler.ts:329-354) NO tiene los buffers old/new en mano: cada
      `ffiDiff` hace sus PROPIAS lecturas de blob por libgit2, una por fichero.
    consequence: >-
      Envolver `parallel.diffBatch` en FFI NO desbloquea a mission-control.
      Haría falta (a) motor batch para metadata y para patch — que NO existe, y
      contradice el "no hay que escribir motor" — y (b) que MC junte los N pares
      antes de llamar, o sea refactor de prefetchDiffs en otro repo.
    corrects: 'una afirmación previa de axon1 a waxin, que se quedó en la mitad barata del problema.'

  - id: gt/double-pipeline
    date: '2026-08-27'
    origin: 'axon1, leyendo el call-site de MC y las dos rutas Zig'
    fact: >-
      El pipeline de diff se ejecuta DOS VECES POR FICHERO en producción hoy.
      mission-control (diff.ts:94-104) llama a diffToMetadata y diffPatch sobre
      los MISMOS dos buffers vía Promise.all; al otro lado
      `hyperdiff_metadata_packed` → generateMetadata (metadata.zig:76) y
      `hyperdiff_patch` → generatePatchFromTexts (patch.zig:392) hacen cada uno
      buildLineIndex ×2 + hashFromIndex ×2 + dispatch de diff.
      El seam para arreglarlo YA existe: `patch.zig:63` generatePatch acepta
      `edits: []const Edit` y no calcula nada — la frontera FFI eligió el
      wrapper que sí calcula.
    consequence: >-
      La ganancia mayor NO es batchear: es dejar de duplicar. Existe con N=1 y
      no depende de que mission-control cambie una línea.

  - id: gt/no-git-objects-in-zig
    date: '2026-08-27'
    fact: >-
      `hyperdiff/core/zig/src/git/` contiene sólo attributes.zig e ignore.zig,
      con CERO `export fn`. hyperdiff NO lee objetos git y no debe empezar: las
      lecturas de blob por libgit2 son de mission-control. Descarta de raíz
      cualquier diseño que mueva esa frontera a Zig.

  - id: gt/parallel-allocator-race
    date: '2026-08-27'
    origin: 'agente batch-export, leyendo parallel.zig:71-83'
    fact: >-
      `diffBatch` pasa el MISMO allocator a todos los `std.Thread.spawn`
      concurrentes. Usar un ArenaAllocator ahí con thread_count>1 es una race
      de escritura sobre el bump-pointer → corrupción de heap. El allocator
      externo debe ser `gpa`/`page_allocator` (thread-safe), y el cleanup el
      loop `deinit` + `free(results)` que el propio doc-comment muestra.
    trap: 'Copiar el patrón "arena para simplificar cleanup" de otras partes de exports.zig se lo come sin avisar.'

  - id: gt/parallel-error-collapse
    date: '2026-08-27'
    origin: 'agente batch-export, leyendo parallel.zig:100-104'
    fact: >-
      El catch de `diffOneInner` colapsa CUALQUIER error a `.error_code = 1`
      genérico, en vez de `errors.errorToCode(err)` como hace todo el resto de
      la superficie FFI (42 códigos reales, 1001-8102). `1` no es un ErrorCode
      válido, así que un consumidor TS que haga `createHyperdiffError(1)`
      rompe la convención. Fix de una línea, pendiente.
