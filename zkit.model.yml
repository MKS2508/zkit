# ── FLOTA de siblings. Cada uno es una sesión Claude real en su worktree. ───
# Un sibling NUNCA escribe este fichero: escribe su report, el axon dueño lo
# verifica y transcribe. Esa es la frontera de confianza de los 3 modelos.
# `globs` DEBE coincidir con el `.siblings.toml` del repo y ser DISJUNTO entre
# lanes del mismo repo — dos siblings sobre el mismo fichero es corrupción.
fleet:
  - lane: bench-harness
    repo: hyperdiff
    axon: axon1
    model: glm
    globs: ['core/bench/sdk-comparison/**']
    nodes: [bugs/catch-swallow]
    blockedBy: 'matriz v4 en vuelo — editar los stacks invalida la run'
  - lane: zig-analyze
    repo: hyperdiff
    axon: axon1
    model: minimax
    globs: ['core/zig/src/**']
    nodes: [bugs/hyperdiff-batch, bugs/parallel-error-codes]
    blockedBy: 'embargo de compilación hasta fin de matriz'
  - lane: docker-mirror
    repo: hyperdiff
    axon: axon1
    model: glm
    globs: ['core/bench/docker/**']
    nodes: [trans/mirror-dockerfile]
  - lane: zkit-errors
    repo: zkit
    axon: axon1
    model: minimax
    globs: ['src/errors.zig', 'src/root.zig', 'docs/design/**']
    nodes: [zkit/errors-mechanism]
    blockedBy: 'embargo de compilación hasta fin de matriz'

  - lane: zig-forge
    repo: styx
    axon: axon2
    model: normal
    globs: ['native/zig/**']
    nodes: []
    note: >-
      VIVA desde 2026-08-27 22:55. Trabajo: R-02 (FETCH cross-track sirve bytes de otro
      track) — nodo de styx.model.yml `track/byte-runtime/m4`, NO de este SSOT; aparece
      aquí sólo para que axon1 vea la capacidad ocupada. Base = rama styx
      `chore/zig-017-convergence`, NO master (master no compila bajo 1884), así que R-02
      aterriza DETRÁS de la convergencia — dependencia de merge declarada aquí y no
      descubierta en el merge. Modelo `normal` (Anthropic) a propósito, no glm: es el
      único de los 13 riesgos que corrompe bytes servidos, y mano de obra barata en un
      bug de corrección es la economía equivocada. Report: /tmp/zig-forge-report.md.

# elysia-svc-forge y ui-forge de axon2 siguen SIN entrar: cero nodos de este SSOT asignados.
# trans/styx-log-convention se mató (ver nodes track trans + gt/styx-logging-already-consistent)
# tras medirse que la premisa era falsa. No hay churn que no exista.

# Vocabulario de `status`. La distinción que importa con flota:
#   pending → in_progress → reported → done
#                              ▲          ▲
#            el SIBLING dice que acabó ───┘          │
#            el AXON lo verificó de forma independiente ┘
# `done` NO se pone con el report del sibling en la mano. Ese es el gotcha
# entero del skill sibling-dispatch: el report es una hipótesis.
# Otros: blocked (dep sin cerrar), designed (diseño hecho, sin implementar),
# deferred (fuera de esta pasada).
statusVocabulary: [pending, in_progress, reported, done, blocked, designed, deferred]

# Mapeo del vocabulario de ESTE ledger a las 4 clases que entiende el engine
# (open | active | done | inert). Lo no clasificado cae en `open`; los defaults
# (done->done, in_progress->active, conditional/vision-locked->inert) siguen vivos.
# `reported` es active a proposito: un ejecutor que dice "hecho" NO satisface un
# dependsOn — la frontera de confianza de la flota vive en esta linea.
statusSemantics:
  active: [reported]
  inert: [deferred, blocked]

# ── LOCKS de waxin. No re-abrir sin evidencia nueva. ────────────────────────
locks:
  - id: lock/mapa-de-consumidores
    date: '2026-08-28'
    quote: >-
      'agentics, conduit, consumerbus (migrado a el nuevo spire) con el ipc,
      hyperdiff, styx consumiran seguramente tambien spire ambos y conduit
      formara parte de styx'
    decision: >-
      El mapa de consumidores queda lockeado con TRES EJES que NO deben
      mezclarse, porque mezclarlos es lo que produce la falsa disyuntiva
      "zkit o spire".

      EJE 1 — QUE se consume. Son DOS capas distintas, no competidoras:
        · substrato nativo (zkit): primitivas Zig, se LINKAN.
        · el wire (spire, que absorbe consumer-bus): contrato NDJSON, se HABLA.
        · `zkit/ipc` es el PUENTE entre las dos: Zig hablando el wire.
        Corolario: hyperdiff y styx consumiran las DOS cosas, y eso no es
        redundancia — es una capa nativa y una de contrato.

      EJE 2 — COMO se consume:
        · Zig directo, linkando el modulo: hyperdiff, styx, conduit.
        · Por C-ABI / FFI: los TypeScript (spire, agentics) y Swift (wraith-app).

      EJE 3 — ESTADO de la relacion:
        · en produccion: hyperdiff, styx.
        · declarado en codigo y esperando: conduit (el TODO de sdk.zig:13).
        · lockeado por waxin, aun sin cablear: mks-agentics.
        · sin decidir: wraith-app (es el sujeto de la §5).

      MOVIMIENTOS ESTRUCTURALES lockeados en esta misma decision:
        · consumer-bus se MIGRA dentro del nuevo spire (deja de ser consumidor
          separado; hasta la migracion sigue siendo el dueno del contrato).
        · conduit pasa a FORMAR PARTE de styx.
        Consecuencia directa y accionable de lo segundo: cuando conduit entre en
        styx, su HandleSlab duplicado SIN contador de generacion aterriza dentro
        de un repo que ya linka el bueno. Dos HandleSlab en un repo y uno con
        use-after-free por construccion. Eso es una funcion forzante, no una
        molestia estetica: la absorcion es el momento natural de matar la copia.

      LOS TRES QUE MOLDEAN el diseno por dogfood (lock previo, se reafirma):
      mks-agentics, styx, hyperdiff. El resto consume.

      ENMENDADO 2026-09-03 por lock/conduit-motor-al-core (2) y (4): conduit SIGUE
      como repo y styx NO es su destino (consumidor opcional). Leer aquella clausula
      antes de citar la frase "conduit formara parte de styx".
