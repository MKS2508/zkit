# ============================================================================
# zkit.model.yml — SSOT COORDINADO del programa zkit + camino verde 0.17-dev
#
# AUTORIDAD ÚNICA del programa cross-repo (authoritative: true).
# Cubre TRES repos a la vez porque el trabajo no se puede partir por repo sin
# mentir: la cadena de pinneo libxev → quic-zig → styx cruza fronteras, y la
# extracción a zkit toca hyperdiff y styx en la misma pasada (lock de waxin).
#
# Qué manda y qué NO:
#   - Este fichero manda sobre el ESTADO y el ORDEN de los nodos del programa.
#   - `hyperdiff/ROADMAP.md` y `styx/styx.model.yml` siguen mandando cada uno
#     sobre SU repo. Aquí sólo viven los nodos del programa, con puntero.
#   - La EVIDENCIA (por qué, qué se descartó, medidas) NO vive aquí: vive en
#     los HANDOFF de ~/dotfiles. Este fichero es estado, no narrativa.
#
# Tres NIVELES ejecutan sobre él, y sólo los dos primeros escriben aquí:
#   axon1   — sesión hyperdiff (Opus). Dueña de hyperdiff, quic-zig, libxev, zkit.
#   axon2   — sesión styx-coord (axon-v2). Dueña de styx.
#   agent   — subagente in-process de un axon; análisis acotado, no commitea.
#   flota   — N siblings por axon (sección `fleet`), worktree propio, modelo
#             barato. NO escriben este fichero: escriben su report, y el axon
#             dueño verifica y transcribe. Es la frontera de confianza.
#
# Regla de escritura (con 2 axones sobre UN solo working tree — no hay clones
# separados, `git pull` no te salva de nada aquí):
#   1. Cada lane toca el `status` de SUS nodos. Nadie reescribe los de otra.
#   2. Edits quirúrgicos, NUNCA reescribir el fichero entero: dos ediciones
#      que no se solapan conviven; un overwrite se come el trabajo del otro.
#   3. Commit inmediato tras editar. Un edit sin commit es invisible para el
#      otro axon y para `git log`.
#   4. Firma en el body del commit qué lane escribe — los dos axones commitean
#      con la misma identidad de git y el log NO los distingue.
# ============================================================================
authoritative: true
model: zkit-program
modelVersion: '1'
project: zkit
scope: cross-repo
created: '2026-08-27'

