      espera. Corolario operativo — cuando un report demuestre algo, mirar
      primero **cómo lo midió**, antes que qué salió.

  - id: gt/gate-ciego-a-las-altas
    date: '2026-08-28'
    verifiedBy: 'axon1, BOGUS_INVENTADO: 1099 añadido solo a errors.ts'
    fact: >-
      Un gate que recorre una lista literal de claves comprueba lo que la lista
      nombra y nada más. Sin una aserción de conteo contra el oráculo es
      unidireccional: caza modificaciones y bajas, y es **ciego a las altas**.
      Verificado en hyperdiff: un código dado de alta sólo en `errors.ts` pasaba
      en verde. Cerrado asertando que el oráculo contiene exactamente esos
      códigos (`expected 49, found 50`).
    consequence: >-
      Vale para cualquier gate de paridad entre dos declaraciones. La pregunta
      de review no es "¿comprueba las entradas?" sino "¿comprueba que no hay
      más?". Y si el gate tiene una tercera transcripción a mano de lo que
      compara, esa lista es la que hay que derivar.

