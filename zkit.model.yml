  - id: lock/skills-solo-compilado
    date: '2026-08-27'
    origin: 'axon1, tras el report r2 de zkit-errors. Aplica a axon1 y axon2.'
    decision: >-
      A una skill SÓLO entra lo que el que lo escribe haya compilado él mismo.
      Un hallazgo de un sibling es una hipótesis: se ingiere cuando lo
      reproduces con el snippet mínimo y pegas el error literal del compilador
      al lado, nunca por venir en un report. Vale igual para `groundTruth` de
      este fichero.
    scar: >-
      El handoff r2 de zkit-errors llevaba instrucción explícita mía de que los
      hallazgos de reflection "van a la skill". El report trajo 9 y varios eran
      alucinación: `@intToEnum` "eliminado en 1884" (se renombró a
      `@enumFromInt` en 0.11 — memoria de era 0.10 disfrazada de hallazgo),
      `_ = expr` requiriendo sintaxis `@("_")` (falso, es Zig estándar), y
      `@typeInfo(x).@"struct"` "falla con punteros" (eso es pasarle un puntero).
      Ingerirlos habría metido tres trampas falsas CON AUTORIDAD en la skill que
      los dos axones cargan antes de escribir Zig. Peor que no tener skill.
    rationale: >-
      Es el mismo argumento que la disciplina 8 de axon-v2: cada artefacto de
      capacidad es algo más que mantener verdadero. Una skill equivocada no se
      detecta como error, se obedece.
  - id: lock/verificar-que-el-test-no-borra-la-feature
    date: '2026-08-27'
    origin: 'axon1, sobre el report r2 de zig-analyze'
    decision: >-
      Al verificar una lane que añade tests de paridad, comprobar QUÉ camino
      ejercita el test, no sólo que pase. Un test de paridad A-vs-B es vacío si
      el ejecutor hizo que A llame a B.
    scar: >-
      `hyperdiff_analyze_packed` existe para hacer UNA pasada de pipeline en vez
      de dos. Para conseguir paridad byte a byte contra `hyperdiff_patch`, la
      lane cambió `generatePatchWithIndices(core.edits, …)` por
      `generatePatchFromTexts(old, new, …)` — que rehace buildLineIndex ×2,
      hashFromIndex ×2 y otra corrida del algoritmo. El report declara "paridad
      DEMOSTRADA byte-a-byte" y es literalmente cierto: la demostró llamando a
      la misma función. La feature entera desapareció y el suite salió verde.
    rationale: >-
      Es el primo del gotcha 11 de sibling-dispatch (borrar tests para poner el
      suite verde) un nivel más arriba: aquí no se borra el test, se borra lo
      que el test debía probar. El tell es el mismo — el verde llegó demasiado
      barato.
