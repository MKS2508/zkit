      Tier 1, se mueve tal cual (5.156 lineas): sync 321, ipc 151, hot_ranker
      372, blob_cache 273, patch_ring 625 (anillo de BYTES; RecordHeader es su
      propio formato), platform_kqueue 1125, platform 2289 (sus 2 externs son ABI
      de Apple, no dominio).
      Tier 2, hay que parametrizar el payload (837 lineas): event_queue 542
      (CChange, CStatusBatch) y patch_queue 295 (CWatchPatchEvent, CWatchPatchBatch).
      El grafo confirma en codigo el orden ya lockeado: sync e ipc son HOJAS
      (solo std/builtin) y se justifican solos; platform depende de los dos.
      Catalogo completo en `zkit/docs/catalogo-infra-extraible.md`.
    contradice: >-
      Nada de la auditoria de consumidores, que sigue en pie: mover codigo de un
      solo consumidor sigue siendo mudanza. Lo que corrige es el ALCANCE de la
      pregunta — la auditoria midio "quien lo usa hoy" y nunca "que hay ya
      construido y desacoplado que un consumidor nuevo podria usar". Con un
      tercer repo entrando, media tabla pasa de 1 consumidor a 2 sin mover una
      linea de codigo. La intuicion de waxin ("veo muchisimo codigo") estaba
      medida y era correcta.
    verificadoPor: axon1
    fecha: '2026-08-28'

  - id: gt/los-4-huerfanos-de-zkit-no-son-archivo-son-el-bus
    fact: >-
      Los modulos que la auditoria marco ARCHIVO por cero consumidores no estan
      muertos: estan HUERFANOS DE SU CONSUMIDOR PREVISTO, que es consumer-bus.
      Leidos sus docstrings: `SubscriberQueue(T)` (481 lineas) es una cola
      acotada POR SUSCRIPTOR con senalizacion explicita de overflow y marcador de
      discontinuidad observable en el siguiente pop; `ReorderBuffer(T)` +
      `SequenceNumber` (822) es reordenacion acotada con semantica terminal, gaps
      con timeout y reset; `HungWorkerWatchdog` (233) es watchdog por deadline.
      Eso es, pieza por pieza, el substrato de un bus pub/sub multi-consumidor
      con snapshot+delta y backpressure por suscriptor — que es literalmente la
      descripcion de `@mks2508/consumer-bus`. 1.536 lineas ya escritas.
      El doc de inception lo dice explicito en §3.3: consumer-bus es "el
      candidato real, no especulativo".
    contradice: >-
      El veredicto "4 archivo" de la auditoria de consumidores. El conteo era
      correcto (cero consumidores hoy) pero la etiqueta era falsa: archivo
      implica que no sirven. Sirven, y su consumidor existe, esta publicado y
      waxin lo quiere unificar ya.
    verificadoPor: axon1
    fecha: '2026-08-28'

  - id: gt/el-inception-esta-stale-sobre-el-transport
    fact: >-
      `~/dotfiles/HANDOFF-zkit-inception.md` §3.3 declara el transport
      unix-socket de consumer-bus como STUB con `err:'not_implemented'`. Es
      FALSO a fecha 2026-08-28: clonado el repo, `src/transport/` tiene
      `unix-socket.server.ts` (276 lineas) y `unix-socket.transport.ts` (309),
      y el grep de `not_implemented` devuelve cero.
      Importa porque ese dato era la mitad del argumento para que zkit
      implementase el protocolo: si en TS no existia, hacerlo en Zig salia casi
      gratis. Existe. El argumento hay que rehacerlo con el dato bueno.
    contradice: >-
      El propio doc de inception, que sigue siendo la referencia que todos
      citamos para la §5. Antes de usarlo para decidir, re-verificar sus datos:
      el repo se movio y el doc se quedo.
    verificadoPor: axon1
    fecha: '2026-08-28'

  - id: gt/conduit-reimplemento-zkit-y-le-quito-la-seguridad
    fact: >-
      `MKS2508/conduit` (repo nuevo, commit 522117f) tiene un `packages/sdk-zig/`
      que REIMPLEMENTA HandleSlab y ReorderBuffer en vez de consumir zkit.
      `dependencies = .{}` esta vacio; la unica mencion a zkit en su .zon es un
      comentario. Verificado clonando el repo.
      Y el propio fuente lo declara: `sdk.zig:13` lleva
      "TODO(sub-import): cuando zkit/ipc/ exista, sub-importar @zkit/handlepool".
      El consumidor no es inferido ni plausible — esta escrito en el codigo,
      esperando.
      La reimplementacion es materialmente PEOR: su HandleSlab es `next: u64`
      monotono mas una free list, SIN contador de generacion. Un handle liberado
      se reutiliza con el mismo valor, asi que un handle viejo sigue resolviendo:
      use-after-free por construccion. La `HandleSlab(T)` de zkit (269 lineas)
      salta la generacion 0 y la incrementa al liberar exactamente para detectar
      eso. Su ReorderBuffer son ~48 lineas contra las 822 de zkit, sin
      SequenceNumber, sin semantica terminal, sin timeout de gaps ni reset.
      Ademas su build.zig.zon declara minimum_zig_version 0.17.0-dev.1893 y el
      repo se construyo con 0.15.1, sin guard comptime: el mismo agujero que
      cerramos anoche en libxev y quic-zig, demostrado en vivo en un repo recien
      nacido.
    contradice: >-
      El veredicto "ReorderBuffer: cero consumidores, archivo" de la auditoria.
      Tiene un segundo consumidor Zig que ya lo duplico. Y contradice el precio
      que el marco de 3 scopes le pone al scope zkit/ipc ("no-ahora" porque zkit
      es recien nacido): el coste de esperar NO es cero, se paga en copias
      duplicadas y menos seguras acumulandose en cada repo nuevo.
    verificadoPor: axon1
    fecha: '2026-08-28'

  - id: gt/el-mapa-de-consumidores-a-fecha-de-hoy
    fact: >-
      Consumidores reales o declarados de zkit a 2026-08-28, todos verificados
      salvo donde se dice:
      hyperdiff (Zig, EN PRODUCCION: HandleSlab x3 slabs + errors.ErrorSpace);
      styx (Zig: HandleSlab + ErrorSpace via local_file.zig + TrackingAllocator
      en el soak); conduit (Zig, reimplemento HandleSlab y ReorderBuffer con TODO
      apuntando a zkit); mks-agentics (waxin lockea que se muda al patron y sera
      consumidor); spire y consumer-bus (TypeScript, privados, spire absorbe a
      consumer-bus, consumen por C-ABI no el modulo Zig); wraith-app (Swift, es
      el sujeto de la §5); mirror (el proyecto del que nacio spire).
      Los tres que MOLDEAN el diseno por dogfood, per lock de waxin: agentics,
      styx y hyperdiff.
    contradice: >-
      La premisa con la que se hizo la auditoria de consumidores, que midio DOS
      repos. Con este mapa, varios modulos que salieron "1 consumidor = mudanza"
      o "cero = archivo" tienen segundo consumidor sin mover una linea.
    verificadoPor: axon1
    fecha: '2026-08-28'

  - id: gt/zkit-no-tiene-frontera-c-abi-y-esa-es-la-puerta
    fact: >-
      `grep -rn "export fn|callconv(.C)"` sobre todo `zkit/src/` devuelve CERO.
      zkit no expone ninguna frontera C-ABI: solo se puede consumir como modulo
      Zig linkado (`b.dependency` + `addImport`), que exige que el consumidor
      compile en Zig. Verificado por el explore del 28-ago.
      Consecuencia que reordena el programa: los cuatro consumidores no-Zig
      (spire y agentics en TS, wraith-app en Swift, el bridge de conduit) NO
      estan bloqueados por que falte `ipc` — estan bloqueados por la frontera
      misma. `ipc` es el contenido; el C-ABI es la puerta, y hoy no existe.
      Decidir la frontera va ANTES que disenar `ipc`.
    fuente: docs/dossier-consumidores-2026-08-28.md
    fecha: 2026-08-28

  - id: gt/hyperdiff-y-styx-ya-consumen-zkit-en-produccion
    fact: >-
      Dos consumidores reales, wireados y verdes, no aspiracionales.
      hyperdiff: `HandleSlab` en tres slabs (`src/exports.zig:50,153-157` para
      caches FFI; `src/watch/exports.zig:40,47,354` para WatchSlab y
      SessionSlab) y `errors.ErrorSpace` para sus 38 codigos
      (`src/errors.zig:27,57`). Arista en `core/zig/build.zig.zon:8-11`.
      styx: `HandleSlab` como pool de buffers de la cache tiered
      (`media-core/cache/tiered_cache.zig:19,46`, codigo de produccion, no test)
      y `TrackingAllocator` en el daemon (`media-daemon/main.zig:61-62`).
      Wireado el mismo 28-ago en los commits 29dd1a9 y 2c14285 (este ultimo
      borra su copia local de TrackingAllocator, -95 lineas netas), con tests y
      TSAN en verde.
      Los dos pinean el mismo tarball `09fd8cfc`, ANTERIOR al guard comptime que
      se anadio en 86a36ef: sus copias vendorizadas no lo llevan.
    fuente: docs/dossier-consumidores-2026-08-28.md
    fecha: 2026-08-28

  - id: gt/el-wire-tiene-tres-bugs-y-por-eso-no-se-puede-congelar
    fact: >-
      El freeze del wire no es una decision pendiente: es "arreglar tres bugs y
      LUEGO decidir". Encontrados leyendo el server contra el transport y el
      cliente de consumer-bus.
      (a) El heartbeat mata toda conexion sana a los ~45s: el server cuenta
      `missedCount`, que solo se resetea con un `pong`, y cierra a las 3 fallas,
      pero NUNCA envia un `ping` (grep de "type: 'ping'" da cero). El cliente
      solo responde `pong` a un `ping` que jamas llega.
      (b) Doble `hello`: el transport manda uno con identidad hardcodeada
      `{consumerType:'wraith'}` y un campo `transport` que no existe en
      `IHelloFrame`; despues `ConsumerBusClient` manda el suyo con la identidad
      real. El transporte in-process no manda ninguno — rompe la invariante I6
      que el propio `transport.contract.ts` declara.
      (c) El `authToken` viaja en el SEGUNDO hello, y para entonces el server ya
      marco `authenticated=true` y lo enruta al dispatcher, que no invoca
      `authenticate`. La auth por socket es estructuralmente inalcanzable.
      Portar un hablante Zig contra esto congela el bug, no el contrato.
    fuente: docs/evidence/explore-consumidores-2026-08-28/spire-cb.md
    fecha: 2026-08-28

  - id: gt/ffi-por-evento-hacia-ts-es-la-forma-equivocada
    fact: >-
      Descartada la via de que spire/consumer-bus consuman las colas de zkit por
      FFI. Lo que viajaria son objetos JS dinamicos con payload validado en
      runtime; Zig necesita `[]T` de layout fijo, asi que habria que serializar
      cada envelope en CADA push/pop — el marshaling cuesta mas que la operacion
      pura en JS (indices en un array, O(1)), y el volumen de ese bus (consumers
      CLI/MCP/menubar de un daemon personal) no esta cerca del regimen que lo
      justificaria.
      Para el lado TS lo que tiene sentido es portar las SEMANTICAS, no el
      codigo: `SubscriberQueue` es literalmente la pieza que el DESIGN.md de
      consumer-bus marca como ausente (el wire ya reserva `IOverflowFrame` en
      frames.ts:125-130 y nada lo construye nunca), y `HungWorkerWatchdog` mapea
      1:1 al heartbeat hand-rolled y roto del server.
      La palanca real de zkit no es FFI hacia TS: es un hablante Zig nativo del
      wire, donde el consumidor es un proceso Zig y las primitivas se usan tal
      cual.
    fuente: docs/dossier-consumidores-2026-08-28.md
    fecha: 2026-08-28

  - id: gt/deuda-propia-de-zkit-que-saco-el-explore
    fact: >-
      Tres cosas que son nuestras, no de los consumidores.
      1. `TrackingAllocator.resize()` tiene under/overflow de `live_bytes` si el
      allocator interno redondea al alza en un shrink. Estaba por igual en las
      copias de styx y de zkit; styx dedupeo hacia nosotros en 2c14285, asi que
      el bug ahora vive SOLO aqui y es upstream.
      2. `zkit.log.scoped` es un DOWNGRADE frente a lo que hacen los
      consumidores: el `std.log.scoped` nativo de Zig es filtrable por scope via
      `std_options.log_scope_levels`, y el nuestro es solo un prefijo de string
      sobre el scope por defecto — pierde esa granularidad. zkit tiene 0
      consumidores de su propio `log`, y hyperdiff y styx usan el nativo.
      Candidato a borrar, no a promocionar.
      3. `HandleSlab` no es thread-safe (documentado en handle.zig:29) y esa
      responsabilidad la carga el consumidor; styx lo serializa bajo
      `TieredCache.mutex`.
    fuente: docs/dossier-consumidores-2026-08-28.md
    fecha: 2026-08-28

  - id: gt/freeze-del-wire-es-precondicion-del-port-a-c-abi
    fact: >-
      Devuelto por la sesion de mks-agentics (COORD
      `~/dotfiles/COORD-agentics-a-axon1-zkit-recibido.md`, commit 2884fc1) como
      condicion PRE-Zig, y lo acepto: el freeze del wire mas un parity gate o
      codegen tiene que existir ANTES del port a C-ABI. Motivo dado: hoy el
      contrato driftaria en silencio — cero `verify:wire`, y el propio DESIGN.md
      del contrato esta stale sobre su transport (mismo hallazgo que yo verifique
      por mi lado: declara el unix-socket como stub `not_implemented` y hay 585
      lineas implementadas).
      El wire vive en `@mks2508/consumer-bus`, y su freeze gatea a su vez con la
      migracion arktype→TypeBox (0.2.0).
      RESTRICCION EXPLICITA que asumo: este freeze NO se lockea desde zkit en
      solitario. El dueno del contrato (consumer-bus, y despues spire cuando lo
      absorba) tiene que sellar la version. Es dependencia cruzada, va al
      interview compartido de manana como item de los dos.
    contradice: >-
      Cualquier plan que arranque `cand/ipc-wakeup` escribiendo el parser del
      protocolo antes de que la version del contrato este sellada. Portar un
      contrato que se mueve es garantizar drift silencioso entre lenguajes, que
      es exactamente el fallo que el puente pretende evitar.
    verificadoPor: 'sesion mks-agentics (reportado), transport stale verificado por axon1'
    fecha: '2026-08-28'

