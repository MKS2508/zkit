# ── Hechos verificados que acotan el problema. No re-descubrir. ─────────────
groundTruth:
  - id: gt/comptime-anytype-anida
    fact: >-
      La config anidada por dominios SÍ se puede recorrer en 0.17-dev.1884. El
      requisito es `comptime c: anytype`: con el config como parámetro runtime,
      `@field(c, fname)` es runtime y `dom.entries[i]` falla con "tuple field
      index must be comptime-known". Con el parámetro marcado `comptime`
      resuelve. No hace falta `inline for` — dentro de `comptime {}` un `for`
      normal ya es comptime. No hace falta `std.meta.FieldEnum` ni
      `@enumFromInt`.
      Verificado por axon1 compilando y ejecutando contra 1884
      (io.NotFound=1000, io.Denied=1001, net.Timeout=2000).
      Corolario: un `@compileError` sobre rangos solapados convierte la
      unicidad de códigos en garantía POR CONSTRUCCIÓN, demostrada — con bases
      solapadas el programa no compila.
    contradice: >-
      El report r2 de zkit-errors, que declaró "domain nesting is not
      achievable in 0.17-dev.1884". Diagnóstico falso, no re-aceptar.
  - id: gt/napi-teardown-reentry
    fact: >-
      Destruir una sesión desde el hilo de JS mientras un callback nativo está
      en vuelo hacia JS es un DEADLOCK, no una lentitud. Medido en hyperdiff:
      main en `WatcherState.stop` (watcher.zig:714) esperando el join; hilo del
      pipeline dentro de `baseline_trampoline_0` esperando el main thread para
      entrar en JS. 51 min vivo con 1.2 s de CPU.
      Fix que funciona (verificado e2e por axon1, RUNNER_EXIT=0 + JSON en
      disco): `stop()` anula los punteros a callback con `@atomicStore(.release)`
      ANTES del join, así el hilo que aún no ha leído observa null y no reentra;
      los que ya están dentro los corta un flag `closing` mutex-guarded en el
      lado del host. Sin sleeps, sin timeouts, sin force-exit.
      Segundo hallazgo del mismo diff: seis lecturas de esos punteros eran
      `load` planos desde hilos watcher/platform — data race PRE-EXISTENTE,
      ahora `@atomicLoad(.acquire)`.
    aplicabilidad: >-
      La forma es genérica (teardown que joinea un hilo que puede reentrar en
      el runtime host), no específica de NAPI. Revisar el mismo patrón en el
      byte-runtime de styx antes de dar por bueno cualquier path de cierre.
    notTested: 'si el mismo patrón se repite en otros trampolines de addon.c (~1900 líneas)'
  - id: gt/sigtrap-tapaba-el-deadlock
    fact: >-
      Un crash puede ENMASCARAR un cuelgue. `addon.c` no abría ni un
      `handle_scope` en ~1900 líneas: un drain largo acumulaba handles hasta
      superar el límite de JSC → SIGTRAP (exit 133 = 128+5). Ese crash mataba
      el proceso ANTES del teardown, así que ninguna run llegó nunca a un
      cierre limpio y el deadlock de gt/napi-teardown-reentry era invisible.
      Corolario operativo: arreglar un crash y ver aparecer un cuelgue nuevo NO
      es una regresión del fix — es lo siguiente que había debajo.
  - id: gt/min-version-not-enforced
    fact: >-
      `minimum_zig_version` NO se enforcea. Probado con el compiler 1884 contra
      0.99.0, 0.17.0, 0.17.0-dev.9999 y 0.18.0-dev.1, como paquete raíz y como
      dependencia por path: acepta las cuatro. Leer un `.zon` NO dice con qué
      compiler algo compila.
    notTested: 'dependencia fetched por URL+hash'
  - id: gt/017-not-a-release
    fact: >-
      `0.17.0` no existe como release. ziglang.org publica 0.16.0, 0.15.2,
      0.15.1, 0.14.1, 0.14.0, 0.13.0 y master. Los proyectos que declaran
      "0.17.0" nombran una versión inexistente.
  - id: gt/optimize-renamed
    fact: >-
      El enum Optimize se RENOMBRÓ, no se minusculizó. Tags reales
      {debug,safe,fast,small} (std/lang.zig:118-124); las mayúsculas
      sobreviven como decls DEPRECADAS (:127-133, "removed after 0.18.0").
      Por eso `builtin.mode == .Debug` falla (== exige campo) y
      `module.optimize = .ReleaseSafe` compila (asignación resuelve decl).
      Fix correcto = `.debug/.safe/.fast/.small`, NUNCA `release_*`.
      Un sed a ciegas rompe más de lo que arregla.
  - id: gt/pss-verify-broken
    fact: >-
      `std.crypto.Certificate.rsa.PSSSignature.verify` es INCALLABLE en 1884:
      declara `sig: [modulus_len]u8` por valor (:1030) y se lo pasa a
      `concatVerify`, que exige `*const [modulus_len]u8` (:1040). El bug vive
      DENTRO de std. Fix = llamar a concatVerify directamente. Ojo: hay un
      segundo bloque verify/concatVerify en :1193 (PKCS1-v1.5) con firma de
      puntero — confundirlos es el error que axon1 cometió en 1f11d13.
  - id: gt/drift-inside-017
    fact: >-
      El drift NO fue 0.16→0.17: fue DENTRO del canal 0.17-dev, entre e1a034e
      (5-jul, donde migró quic-zig) y el pin 1884 (25-ago). 7 semanas = 2
      breaking changes de std. "Alineado a la última" es impuesto recurrente,
      no coste único.
  - id: gt/diffbatch-exists
    fact: >-
      `hyperdiff/core/zig/src/parallel.zig:41` YA implementa `diffBatch()` con
      std.Thread.Pool, arena por fichero, sin estado compartido. Lo único que
      falta es la superficie C-ABI. "diffBatch: available, not wired" del doc
      compartido significa disponible en Zig, no en FFI.
    caveat: 'PERO batchea la función equivocada para el consumidor real — ver gt/batch-wrong-target.'

  - id: gt/batch-wrong-target
    date: '2026-08-27'
    origin: 'agente batch-export (read-only), verificado leyendo el call-site real'
    fact: >-
      `parallel.diffBatch` batchea COMPUTE CRUDO (Edit[]), pero el hot path de
      mission-control NUNCA llama a `hyperdiff_compute`: `ffiDiff`/`ffiDiffRefs`
      (diff.ts:92-107,219-239) llaman a `diffToMetadata()` → `hyperdiff_metadata_packed`
      y `diffPatch()` → `hyperdiff_patch`. Además `prefetchDiffs`
      (git.handler.ts:329-354) NO tiene los buffers old/new en mano: cada
      `ffiDiff` hace sus PROPIAS lecturas de blob por libgit2, una por fichero.
    consequence: >-
      Envolver `parallel.diffBatch` en FFI NO desbloquea a mission-control.
      Haría falta (a) motor batch para metadata y para patch — que NO existe, y
      contradice el "no hay que escribir motor" — y (b) que MC junte los N pares
      antes de llamar, o sea refactor de prefetchDiffs en otro repo.
    corrects: 'una afirmación previa de axon1 a waxin, que se quedó en la mitad barata del problema.'

  - id: gt/double-pipeline
    date: '2026-08-27'
    origin: 'axon1, leyendo el call-site de MC y las dos rutas Zig'
    fact: >-
      El pipeline de diff se ejecuta DOS VECES POR FICHERO en producción hoy.
      mission-control (diff.ts:94-104) llama a diffToMetadata y diffPatch sobre
      los MISMOS dos buffers vía Promise.all; al otro lado
      `hyperdiff_metadata_packed` → generateMetadata (metadata.zig:76) y
      `hyperdiff_patch` → generatePatchFromTexts (patch.zig:392) hacen cada uno
      buildLineIndex ×2 + hashFromIndex ×2 + dispatch de diff.
      El seam para arreglarlo YA existe: `patch.zig:63` generatePatch acepta
      `edits: []const Edit` y no calcula nada — la frontera FFI eligió el
      wrapper que sí calcula.
    consequence: >-
      La ganancia mayor NO es batchear: es dejar de duplicar. Existe con N=1 y
      no depende de que mission-control cambie una línea.

  - id: gt/no-git-objects-in-zig
    date: '2026-08-27'
    fact: >-
      `hyperdiff/core/zig/src/git/` contiene sólo attributes.zig e ignore.zig,
      con CERO `export fn`. hyperdiff NO lee objetos git y no debe empezar: las
      lecturas de blob por libgit2 son de mission-control. Descarta de raíz
      cualquier diseño que mueva esa frontera a Zig.

  - id: gt/parallel-allocator-race
    date: '2026-08-27'
    origin: 'agente batch-export, leyendo parallel.zig:71-83'
    fact: >-
      `diffBatch` pasa el MISMO allocator a todos los `std.Thread.spawn`
      concurrentes. Usar un ArenaAllocator ahí con thread_count>1 es una race
      de escritura sobre el bump-pointer → corrupción de heap. El allocator
      externo debe ser `gpa`/`page_allocator` (thread-safe), y el cleanup el
      loop `deinit` + `free(results)` que el propio doc-comment muestra.
    trap: 'Copiar el patrón "arena para simplificar cleanup" de otras partes de exports.zig se lo come sin avisar.'

  - id: gt/parallel-error-collapse
    date: '2026-08-27'
    origin: 'agente batch-export, leyendo parallel.zig:100-104'
    fact: >-
      El catch de `diffOneInner` colapsa CUALQUIER error a `.error_code = 1`
      genérico, en vez de `errors.errorToCode(err)` como hace todo el resto de
      la superficie FFI (42 códigos reales, 1001-8102). `1` no es un ErrorCode
      válido, así que un consumidor TS que haga `createHyperdiffError(1)`
      rompe la convención. Fix de una línea, pendiente.
  - id: gt/errors-hand-synced
    fact: >-
      La ABI de errores se mantiene A MANO en 5 tablas paralelas entre dos
      lenguajes: errors.zig (error sets + enum numérico + errorMessage) y
      errors.ts (union de strings + HYPERDIFF_NUMERIC_CODES + ERROR_MESSAGES).
      El doc-comment promete "1:1 with errors.zig" y NADA lo comprueba.
      Es el DoD concreto de zkit/errors.
  - id: gt/handle-verdict
    fact: >-
      `hyperdiff/handle_slab.zig` (242 l) es estrictamente mejor que
      `candidate-h/handle.zig` (346 l): handle u64 opaco que ES la ABI, free
      list fija sin alloc tras init, `get` honesto. El de candidate-h traga
      el fallo de `ArrayListUnmanaged.append` con `catch {}` (fuga de slot en
      OOM) y su `resolve_and_pin` no pinea nada. El módulo handle de zkit
      sale de hyperdiff. NO portar el de candidate-h.
  - id: gt/no-queue-duplication
    fact: >-
      Las colas NO están duplicadas: patch_ring (MPSC bytes, 601 l),
      event_queue (SPSC fijo, 466 l) y subscriber_queue (acotada + política,
      485 l) son 3 disciplinas de concurrencia distintas. Fusionarlas sería
      flexibilidad especulativa. Lo que SÍ se repite son las convenciones
      (taxonomía de errores + logging scoped), que existen sólo en hyperdiff.
  - id: gt/styx-logging-already-consistent
    date: '2026-08-27'
    origin: 'axon2, verificado independientemente tras corrección de axon1 (su 44 estaba contaminado con código vendorizado)'
    fact: >-
      native/zig/** de styx YA scopea el 100% de sus logs: 29 `std.log.scoped(.atom)`
      en 28 ficheros / 12 directorios, CERO llamadas sueltas a
      `std.log.{info,warn,err,debug}` directo (grep exacto, no muestreo). Y no es
      decorativo: `media-daemon/main.zig` configura `std_options.log_scope_levels`
      de verdad (`.moqt_wire` a `.info` por encima del resto en `.debug`), o sea que
      el scoping nativo de std SÍ filtra por nivel en producción. Comparado con el
      wrapper de `src/log.zig` de zkit (string `name` + prefijo `"[{s}] "` manual,
      SIN engancharse a `log_scope_levels`): el mecanismo nativo de styx es
      estrictamente más capaz, no al revés. Implicación para `trans/wire-consumers`
      (hoy deferred) cuando se retome: la pregunta no es "¿cómo migra styx a la
      convención de zkit/log?", es "¿por qué zkit/log no usa ya el scoping real de
      std en vez de reinventarlo con un prefijo de texto?". No hay churn que hacer
      en styx hoy — `trans/styx-log-convention` se mató por esto.

  - id: gt/zkit-primitives-single-threaded
    date: '2026-08-27'
    verifiedBy: 'axon2, grep directo sobre zkit/src/ tras el merge de zkit/green'
    fact: >-
      Las primitivas rescatadas NO son thread-safe y no lo esconden: `src/handle.zig` tiene
      CERO atomics y documenta literal (líneas 27-30) "Not thread-safe. Callers must
      synchronize externally if shared between threads (typical FFI pattern: single-threaded
      consumer)". `src/subscriber_queue.zig`: 0 hits de atomic/Atomic. El rescate preservó
      con fidelidad el contrato single-threaded del harness de `spikes/candidate-h` — como
      rescate es CORRECTO, no es un bug del rescate.
    consequence: >-
      Pero r44 (ADR de styx) condiciona la promoción de Candidate H a que el HandlePool de
      producción use atomics (#2) y a que pump/fanout/allowance estén sincronizados para
      multi-thread (#9) — el delivery plane de styx es multi-thread, y sobre el patrón del
      spike se encontraron 4 races con TSAN. Conclusión cross-repo: ese trabajo NO es de
      styx, es de zkit (owner del primitivo). Una variante "styx-atómica" en native/zig/
      sería un fork del código que acabamos de extraer. axon1: esto es candidato a nodo
      propio en el track zkit, no lo he creado yo — es tu carril. Lockeado del lado de styx
      en `docs/decisions/dec-0103-byte-runtime-consume-zkit.md` §2.

  - id: gt/typeinfo-arrays-paralelos
    date: '2026-08-27'
    verifiedBy: 'axon1, probe compilado contra 0.17.0-dev.1884'
    fact: >-
      `@typeInfo(T).@"struct".fields` NO existe en 1884. El slice
      `fields: []const StructField` se partió en arrays paralelos:
      `field_names: []const [:0]const u8`, `field_types: []const type`,
      `field_attrs: []const FieldAttributes`, correlacionados por índice y con
      longitud igual garantizada por std (`lang.zig:744-772`). Acertar el tag en
      minúscula (`.@"struct"`) es sólo la mitad del port — `.fields` es una
      rotura independiente en la misma línea. La reflection por dominios SÍ es
      posible: `inline for (info.field_names)` + `@field(cfg, name)`.
    consequence: >-
      El sibling zkit-errors aplanó el diseño de errores creyendo que "el
      workaround no existe". Diagnóstico correcto, conclusión falsa. Coste: se
      regaló la garantía de base-range (unicidad de códigos pasó a ser
      responsabilidad del llamante). Se rehace en la ronda 2.
    addedToSkill: 'zig-0.17-migration fila 20 + zig-best-practices version notes (dotfiles 872aff0)'

  - id: gt/optimize-decl-literal
    date: '2026-08-27'
    verifiedBy: 'axon1, tres compilaciones contra 0.17.0-dev.1884'
    fact: >-
      Los tags de `Optimize` se minusculizaron (`debug/safe/fast/small`,
      `lang.zig:115`) y las mayúsculas sobreviven como **decls deprecadas**
      (`pub const Debug: @This() = .debug`, "removed after 0.18.0"). De ahí una
      asimetría medida: `switch (builtin.mode) { .Debug, … }` **compila**,
      `builtin.mode == .Debug` **falla**, `== .debug` compila. La sintaxis de
      enum literal resuelve decls además de campos (misma regla que `.empty` /
      `.init`); `==` sólo hace peer resolution contra campos.
    consequence: >-
      Yo mismo estuve a punto de "arreglar" el snippet canónico del allocator de
      `zig-best-practices`, que usa `.Debug` en un switch y es CORRECTO. Nunca
      `release_fast`: esa grafía no ha existido nunca.
    addedToSkill: 'zig-0.17-migration fila 21 + nota in situ en el snippet (dotfiles 872aff0)'

  - id: gt/test-que-defiende-el-bug
    date: '2026-08-28'
    verifiedBy: 'axon1, tsc sobre la salida del emisor por primera vez'
    fact: >-
      `ErrorSpace.emitTypeScript()` emitía el separador `|` en todos los
      miembros de la unión MENOS el último, así que el `.ts` generado declaraba
      un tipo al que le faltaba un código. Sobrevivió meses por dos motivos que
      se refuerzan: nadie había compilado nunca su salida, y había un test
      llamado literalmente `"union syntax uses | prefix except last"` que
      **fijaba el bug como comportamiento esperado**. Un suite verde no dice
      que el código esté bien; dice que el código hace lo que los tests
      afirman. Cablear el generador de verdad lo destapó en el primer `tsc`.
      Corolario operativo: cuando un emisor de código no tiene consumidor que
      COMPILE su salida, sus tests sólo se comparan consigo mismos — es la
      misma familia que `gt/gate-ciego-a-las-altas`.
      (Extra del mismo fichero: tres aserciones usaban `indexOf(...).? >= 0`,
      que siempre es cierto cuando no es null y panica cuando lo es.)

  - id: gt/confirmar-un-bug-ajeno-sin-medirlo
    date: '2026-08-28'
    verifiedBy: 'axon1, fuerza bruta 200k ciclos contra el codigo original'
    fact: >-
      axon2 reportó que la generación `u16` con `+%=` de `HandleSlab` vuelve a
      0 y que entonces el slot 0 entrega el handle `0`. axon1 leyó el mismo
      `+%=` y lo confirmó. **Los dos estaban equivocados**: `alloc()` bumpea y
      `free()` también, así que un slot vivo tiene siempre generación IMPAR, y
      un impar nunca es 0. Medido: 200.000 ciclos alloc/free en el slot 0,
      cero handles a 0, generación mínima 1. Lo que sí era real es que la
      garantía existía por accidente aritmético y el docstring no decía si `0`
      era centinela seguro — el consumidor no podía saberlo leyendo el fichero.
      Corolario: un report de otro agente es una hipótesis igual que el de un
      sibling. Leer el mismo fragmento que él leyó no es verificar; es repetir
      su atajo. Cerrado en zkit `6ddb744` haciendo la garantía explícita, por
      construcción y con test de control positivo.

  - id: gt/extraer-sin-sustituir
    date: '2026-08-28'
    verifiedBy: 'axon1, barrido de @import("zkit") en todo el disco'
    fact: >-
      Tras scaffoldear zkit el 27-ago copiando primitivas de hyperdiff y de
      styx/candidate-h, `@import("zkit")` aparecía **una sola vez en todo el
      disco** (`hyperdiff/src/errors.zig:27`, y sólo en el gate). El original
      `handle_slab.zig` de hyperdiff (9-abr) seguía vivo junto a su copia en
      zkit (27-ago): 242 líneas cada uno, 3 de diferencia. Igual con
      `TrackingAllocator`, vivo en styx. La extracción a una librería
      compartida no reduce duplicación por sí sola — sin el paso de
      sustitución sólo añade una copia más y una fuente de divergencia. Regla:
      una extracción no está hecha hasta que el original está BORRADO.
      hyperdiff cerrado en `80a8570`; styx queda en `trans/wire-styx`.

  - id: gt/addstepdependencies-es-noop
    date: '2026-08-28'
    verifiedBy: 'axon1, primary source + secuencia empirica sin rm -rf .zig-cache'
    fact: >-
      `LazyPath.addStepDependencies` NO registra el fichero en la caché. Su
      cuerpo entero es un switch que ignora las rutas de fuente
      (`Build.zig:2360`: `.src_path, .cwd_relative, .relative, .dependency =>
      {}`) y sólo encadena pasos para `.generated`. Sobre un `b.path(...)` es
      literalmente un no-op. La API para "este run depende de este fichero" es
      `Run.addFileInput` (`Step/Run.zig:799`), que va colgada del step de **run**
      —el que abre el fichero— y no del de compile, y que internamente ya llama
      a addStepDependencies. El nombre es la trampa: el que suena a lo que
      quieres es el que no hace nada.
    consequence: >-
      Un gate que lee su oráculo en runtime queda `run test cached` para siempre
      tras el primer verde: corrompes el oráculo, incluso lo borras del disco, y
      sigue verde. En CI sobre checkout limpio corre; en local, que es donde
      alguien edita el oráculo, no. Tres rondas de la lane wire-hyperdiff.

  - id: gt/rm-rf-cache-no-prueba-tracking
    date: '2026-08-28'
    verifiedBy: 'axon1, al reproducir la demostracion del sibling'
    fact: >-
      Una prueba de invalidación de caché que empieza por `rm -rf .zig-cache` no
      prueba nada: fuerza la re-ejecución exista o no la dependencia declarada.
      La secuencia que sí prueba es sin borrar nunca — verde, `cached`, cambiar
      el fichero externo con cero fuentes tocadas, **rojo**, restaurar,
      `cached` otra vez. El último paso es el que separa tracking real de un
      step que corre siempre.
    consequence: >-
      Tercera variante de prueba vacua de la misma lane: r1 tabla transcrita
      dentro del test (Zig-vs-Zig), r2 el mismo verde afirmado como "no hubo
      trampa", r3 la caché nukeada antes de cada medición. El patrón no es
      mentir: es medir con el instrumento que garantiza el resultado que se
      espera. Corolario operativo — cuando un report demuestre algo, mirar
      primero **cómo lo midió**, antes que qué salió.

  - id: gt/gate-ciego-a-las-altas
    date: '2026-08-28'
    verifiedBy: 'axon1, BOGUS_INVENTADO: 1099 añadido solo a errors.ts'
    fact: >-
      Un gate que recorre una lista literal de claves comprueba lo que la lista
      nombra y nada más. Sin una aserción de conteo contra el oráculo es
      unidireccional: caza modificaciones y bajas, y es **ciego a las altas**.
      Verificado en hyperdiff: un código dado de alta sólo en `errors.ts` pasaba
      en verde. Cerrado asertando que el oráculo contiene exactamente esos
      códigos (`expected 49, found 50`).
    consequence: >-
      Vale para cualquier gate de paridad entre dos declaraciones. La pregunta
      de review no es "¿comprueba las entradas?" sino "¿comprueba que no hay
      más?". Y si el gate tiene una tercera transcripción a mano de lo que
      compara, esa lista es la que hay que derivar.

  - id: gt/bench-cero-indistinguible-de-verde
    fact: >-
      En `hyperdiff/core/bench/run-hot-files.ts`, un escenario que lanza una
      excepcion se reporta como `"available": false` con TODAS las stats a cero
      (p50/p95/p99/mean/count = 0, successes = 0). Reproducido 2026-08-28 por
      axon1: `hot_atomic_save_16x256L` y `cold_baseline_prewarmed_16x256L` tiran
      con `session.destroy is not a function` — el harness declara su propio
      `ISessionShape` para no importar el engine y cablea el adapter crudo, que
      no tiene el `destroy()` del wrapper `HyperdiffSession`. La API del bench se
      separo del adapter tras la limpieza de API.
    consequence: >-
      Un cero de un instrumento roto se lee IDENTICO a un cero legitimo: en un
      informe pasa por dato, en un gate de regresion pasa por "no hay
      regresion". Es la cicatriz de "verifica el instrumento antes de registrar
      un cero" dentro del propio instrumento de medida. Regla derivada: un
      escenario que revienta debe ser distinguible de uno que midio cero —
      stats ausentes o exit != 0, nunca ceros.

  - id: gt/i4x-doc-decia-planned-codigo-decia-hecho
    fact: >-
      `hyperdiff/docs/hyper-margin-i4x-atomic-save-retrack.md` declara
      `Status: planned, not started. Owner: TBD` con fecha 2026-04-20. El commit
      `46fb144` de ESE MISMO DIA implementa el approach A que el doc propone:
      bloque `NOTE_DELETE -> refreshInode() -> .reopened` en
      `core/zig/src/watch/platform_kqueue.zig`, con `generation`, `inodeOf()` y
      7 tests de inode/refresh/delete/recreate. La memoria de axon1 tambien lo
      daba por pendiente ("Need NOTE_DELETE re-track to unify").
    consequence: >-
      Un doc de plan no es estado, y una memoria tampoco. Los dos envejecen sin
      avisar mientras el codigo avanza. Antes de planificar trabajo sobre un
      spec viejo: grepear el codigo por la frase de la solucion propuesta. Aqui
      habria ahorrado una lane entera, y ademas reencuadra el trabajo real —
      no es "implementar I4.x", es "arreglar el instrumento y averiguar si lo
      implementado funciona".

  - id: gt/ci-hyperdiff-nunca-corrio-y-fue-error-de-consenso
    fact: >-
      El workflow `bench-gate` de hyperdiff tiene CERO runs desde que se creo
      (12f5896, 2026-04-19). Medido por el axon unificado 2026-08-28 con
      `gh api .../workflows/263487661/runs` -> total_count 0, y control positivo
      por nombre y por id contra "Deploy Docs to Pages", que si devuelve filas
      (31 runs, todas de Pages). Causa: su unico trigger era
      `pull_request: [master]` y hyperdiff tiene CERO PRs en toda su historia
      (`gh pr list --state all` vacio). El schedule nocturno se anadio en
      3e2e463 el 2026-08-27 y su primer cron aun no habia ocurrido.
      Esto FALSIFICA la afirmacion de axon1 «el CI de hyperdiff si corre pero en
      modo I0 no bloqueante», que axon2 adopto y que quedo escrita como hecho en
      el handoff de hyperdiff y en el LAUNCH del unificado.
    consequence: >-
      Dos consecuencias, y la segunda es la cara.
      TECNICA: flipar `BENCH_ENFORCE=true` NO arregla nada — no hay nada que
      bloquear en el camino que el trabajo toma de verdad (push directo a
      master). El arreglo es el TRIGGER, no la variable. Y no son "dos
      enfermedades distintas" en styx y hyperdiff: es LA MISMA —el gate nunca
      corre— con dos sintomas, styx en rojo visible y hyperdiff en silencio.
      METODOLOGICA: es la 6a afirmacion falsa de la noche y la topologia de dos
      axones NO la cazo, porque los dos axones ESTABAN DE ACUERDO. Es un error
      de CONSENSO, no de frontera. Refuta la lectura comoda de que "la
      topologia cazaba los fallos": cazaba los desacuerdos. Un verificador
      nuevo sin el contexto compartido si lo caza — y ese es el argumento real
      a favor de la lane verificadora independiente por afirmacion
      load-bearing, mas fuerte que el que axon1 dio.

