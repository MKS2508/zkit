  - id: gt/typeinfo-arrays-paralelos
    date: '2026-08-27'
    verifiedBy: 'axon1, probe compilado contra 0.17.0-dev.1884'
    fact: >-
      `@typeInfo(T).@"struct".fields` NO existe en 1884. El slice
      `fields: []const StructField` se partió en arrays paralelos:
      `field_names: []const [:0]const u8`, `field_types: []const type`,
      `field_attrs: []const FieldAttributes`, correlacionados por índice y con
      longitud igual garantizada por std (`lang.zig:744-772`). Acertar el tag en
      minúscula (`.@"struct"`) es sólo la mitad del port — `.fields` es una
      rotura independiente en la misma línea. La reflection por dominios SÍ es
      posible: `inline for (info.field_names)` + `@field(cfg, name)`.
    consequence: >-
      El sibling zkit-errors aplanó el diseño de errores creyendo que "el
      workaround no existe". Diagnóstico correcto, conclusión falsa. Coste: se
      regaló la garantía de base-range (unicidad de códigos pasó a ser
      responsabilidad del llamante). Se rehace en la ronda 2.
    addedToSkill: 'zig-0.17-migration fila 20 + zig-best-practices version notes (dotfiles 872aff0)'

  - id: gt/optimize-decl-literal
    date: '2026-08-27'
    verifiedBy: 'axon1, tres compilaciones contra 0.17.0-dev.1884'
    fact: >-
