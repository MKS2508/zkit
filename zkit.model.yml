      `lang.zig:115`) y las mayúsculas sobreviven como **decls deprecadas**
      (`pub const Debug: @This() = .debug`, "removed after 0.18.0"). De ahí una
      asimetría medida: `switch (builtin.mode) { .Debug, … }` **compila**,
      `builtin.mode == .Debug` **falla**, `== .debug` compila. La sintaxis de
      enum literal resuelve decls además de campos (misma regla que `.empty` /
      `.init`); `==` sólo hace peer resolution contra campos.
    consequence: >-
