  - id: gt/addstepdependencies-es-noop
    date: '2026-08-28'
    verifiedBy: 'axon1, primary source + secuencia empirica sin rm -rf .zig-cache'
    fact: >-
      `LazyPath.addStepDependencies` NO registra el fichero en la caché. Su
      cuerpo entero es un switch que ignora las rutas de fuente
      (`Build.zig:2360`: `.src_path, .cwd_relative, .relative, .dependency =>
      {}`) y sólo encadena pasos para `.generated`. Sobre un `b.path(...)` es
      literalmente un no-op. La API para "este run depende de este fichero" es
      `Run.addFileInput` (`Step/Run.zig:799`), que va colgada del step de **run**
      —el que abre el fichero— y no del de compile, y que internamente ya llama
      a addStepDependencies. El nombre es la trampa: el que suena a lo que
      quieres es el que no hace nada.
    consequence: >-
      Un gate que lee su oráculo en runtime queda `run test cached` para siempre
      tras el primer verde: corrompes el oráculo, incluso lo borras del disco, y
      sigue verde. En CI sobre checkout limpio corre; en local, que es donde
      alguien edita el oráculo, no. Tres rondas de la lane wire-hyperdiff.

