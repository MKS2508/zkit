# ============================================================================
# zkit.model.yml — SSOT COORDINADO del programa zkit + camino verde 0.17-dev
#
# AUTORIDAD ÚNICA del programa cross-repo (authoritative: true).
# Cubre TRES repos a la vez porque el trabajo no se puede partir por repo sin
# mentir: la cadena de pinneo libxev → quic-zig → styx cruza fronteras, y la
# extracción a zkit toca hyperdiff y styx en la misma pasada (lock de waxin).
#
# Qué manda y qué NO:
#   - Este fichero manda sobre el ESTADO y el ORDEN de los nodos del programa.
#   - `hyperdiff/ROADMAP.md` y `styx/styx.model.yml` siguen mandando cada uno
#     sobre SU repo. Aquí sólo viven los nodos del programa, con puntero.
#   - La EVIDENCIA (por qué, qué se descartó, medidas) NO vive aquí: vive en
#     los HANDOFF de ~/dotfiles. Este fichero es estado, no narrativa.
#
# Tres NIVELES ejecutan sobre él, y sólo los dos primeros escriben aquí:
#   axon1   — sesión hyperdiff (Opus). Dueña de hyperdiff, quic-zig, libxev, zkit.
#   axon2   — sesión styx-coord (axon-v2). Dueña de styx.
#   agent   — subagente in-process de un axon; análisis acotado, no commitea.
#   flota   — N siblings por axon (sección `fleet`), worktree propio, modelo
#             barato. NO escriben este fichero: escriben su report, y el axon
#             dueño verifica y transcribe. Es la frontera de confianza.
#
# Regla de escritura (con 2 axones sobre UN solo working tree — no hay clones
# separados, `git pull` no te salva de nada aquí):
#   1. Cada lane toca el `status` de SUS nodos. Nadie reescribe los de otra.
#   2. Edits quirúrgicos, NUNCA reescribir el fichero entero: dos ediciones
#      que no se solapan conviven; un overwrite se come el trabajo del otro.
#   3. Commit inmediato tras editar. Un edit sin commit es invisible para el
#      otro axon y para `git log`.
#   4. Firma en el body del commit qué lane escribe — los dos axones commitean
#      con la misma identidad de git y el log NO los distingue.
# ============================================================================
authoritative: true
model: zkit-program
modelVersion: '1'
project: zkit
scope: cross-repo
created: '2026-08-27'

repos:
  - id: zkit
    path: '/Volumes/KODAK1TB/REPOS y PROYECTOS/zig-and-node-bun-related/zkit'
    remote: 'MKS2508/zkit (privado)'
    ssot: 'zkit.model.yml (este fichero)'
    role: 'destino de la extracción; nace standalone, sin consumidores wireados'
  - id: hyperdiff
    path: '/Volumes/KODAK1TB/REPOS y PROYECTOS/zig-and-node-bun-related/hyperdiff'
    remote: 'MKS2508/hyperdiff'
    ssot: 'ROADMAP.md'
    role: 'referencia de toolchain (ya en el destino 0.17-dev.1884) y origen de handle/errors/log'
  - id: styx
    path: '/Volumes/KODAK1TB/REPOS y PROYECTOS/styx'
    remote: 'MKS2508/styx'
    ssot: 'styx.model.yml (deferred d12)'
    role: 'origen del rescate (spikes/candidate-h) y mayor superficie rota'
  - id: quic-zig
    path: '/Volumes/KODAK1TB/REPOS y PROYECTOS/mks2508-quic-zig'
    remote: 'MKS2508/quic-zig'
    ssot: null
    role: 'eslabón de la cadena de pinneo; submodule de styx en docs/references/quic-zig'
  - id: libxev
    path: '/Volumes/KODAK1TB/REPOS y PROYECTOS/libxev'
    remote: 'MKS2508/libxev (fork)'
    ssot: null
    role: 'raíz de la cadena de pinneo'

lanes:
  - id: axon1
    session: hyperdiff
    model: opus
    owns: [hyperdiff, quic-zig, libxev, zkit]
  - id: axon2
    session: styx-coord
    model: anthropic
    owns: [styx]
    note: 'axon-v2: NUNCA implementa código, despacha y verifica'
  - id: agent
    session: 'subagente de axon1'
    model: sonnet
    owns: []
    note: 'análisis acotado read-only; no commitea'

# ── FLOTA de siblings. Cada uno es una sesión Claude real en su worktree. ───
# Un sibling NUNCA escribe este fichero: escribe su report, el axon dueño lo
# verifica y transcribe. Esa es la frontera de confianza de los 3 modelos.
# `globs` DEBE coincidir con el `.siblings.toml` del repo y ser DISJUNTO entre
# lanes del mismo repo — dos siblings sobre el mismo fichero es corrupción.
fleet:
  - lane: bench-harness
    repo: hyperdiff
    axon: axon1
    model: glm
    globs: ['core/bench/sdk-comparison/**']
    nodes: [bugs/catch-swallow]
    blockedBy: 'matriz v4 en vuelo — editar los stacks invalida la run'
  - lane: zig-analyze
    repo: hyperdiff
    axon: axon1
    model: minimax
    globs: ['core/zig/src/**']
    nodes: [bugs/hyperdiff-batch, bugs/parallel-error-codes]
    blockedBy: 'embargo de compilación hasta fin de matriz'
  - lane: docker-mirror
    repo: hyperdiff
    axon: axon1
    model: glm
    globs: ['core/bench/docker/**']
    nodes: [trans/mirror-dockerfile]
  - lane: zkit-errors
    repo: zkit
    axon: axon1
    model: minimax
    globs: ['src/errors.zig', 'src/root.zig', 'docs/design/**']
    nodes: [zkit/errors-mechanism]
    blockedBy: 'embargo de compilación hasta fin de matriz'

  - lane: zig-forge
    repo: styx
    axon: axon2
    model: normal
    globs: ['native/zig/**']
    nodes: []
    note: >-
      VIVA desde 2026-08-27 22:55. Trabajo: R-02 (FETCH cross-track sirve bytes de otro
      track) — nodo de styx.model.yml `track/byte-runtime/m4`, NO de este SSOT; aparece
      aquí sólo para que axon1 vea la capacidad ocupada. Base = rama styx
      `chore/zig-017-convergence`, NO master (master no compila bajo 1884), así que R-02
      aterriza DETRÁS de la convergencia — dependencia de merge declarada aquí y no
      descubierta en el merge. Modelo `normal` (Anthropic) a propósito, no glm: es el
      único de los 13 riesgos que corrompe bytes servidos, y mano de obra barata en un
      bug de corrección es la economía equivocada. Report: /tmp/zig-forge-report.md.

# elysia-svc-forge y ui-forge de axon2 siguen SIN entrar: cero nodos de este SSOT asignados.
# trans/styx-log-convention se mató (ver nodes track trans + gt/styx-logging-already-consistent)
# tras medirse que la premisa era falsa. No hay churn que no exista.

# Vocabulario de `status`. La distinción que importa con flota:
#   pending → in_progress → reported → done
#                              ▲          ▲
#            el SIBLING dice que acabó ───┘          │
#            el AXON lo verificó de forma independiente ┘
# `done` NO se pone con el report del sibling en la mano. Ese es el gotcha
# entero del skill sibling-dispatch: el report es una hipótesis.
# Otros: blocked (dep sin cerrar), designed (diseño hecho, sin implementar),
# deferred (fuera de esta pasada).
statusVocabulary: [pending, in_progress, reported, done, blocked, designed, deferred]

