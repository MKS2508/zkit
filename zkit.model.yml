  - id: lock/matriz-al-final
    date: '2026-08-27 23:00'
    quote: >-
      'y si dejamos la tanda para cuando este ya todo el codigo perfecto, todas las
      versiones alineadas, todo republicado, consumiendo zkit perfecto etc en lugar
      de una por tanda que nos retrasa mucho?'
    decision: >-
      La matriz v4 completa se corre UNA VEZ, al final: codigo final, versiones
      alineadas, paquetes republicados y zkit consumido. NO una por tanda.
    rationale: >-
      Una matriz por tanda mide una revision que nadie va a shippear, y la invalida
      el siguiente merge. Los gates G1-G7 certifican un RELEASE, no un
      work-in-progress. Con 6 intentos fallidos a la espalda, un septimo sobre codigo
      no-final es sunk cost con disfraz de rigor. Ademas elimina de raiz la colision
      CPU/estabilidad-de-codigo: no hace falta worktree pinneado ni parar la flota.
    riskAccepted: >-
      Se pierde el aviso temprano de regresion: si algo regresa a mitad, se descubre
      al final y cuesta atribuirlo al merge que lo movio.
    mitigation: >-
      El tripwire YA existe y no se estaba usando: bench-gate.yml corre bench:matrix
      + bench:gate en cada PR y nightly a las 05:00 UTC, en runners de GitHub (cero
      bloqueo local). Dos arreglos para que sirva: (1) su baseline es
      baseline-2026-04-19.json, CUATRO MESES viejo — anterior a SDK v1, a hyper-margin
      entero y a los fixes de esta noche, asi que hoy no detecta nada; refrescarlo tras
      cada tanda de merges. (2) sigue en modo no-enforcing (continue-on-error + gate
      solo falla con vars.BENCH_ENFORCE=true). CI detecta DERIVA RELATIVA; los numeros
      absolutos de los gates siguen siendo del mac.
  - id: lock/bindings-parity
    date: '2026-08-27'
    decision: >-
      Los bindings de hyperdiff (ffi-bun/napi/ffi-deno) se extraen con PARITY
